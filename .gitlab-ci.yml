stages:
  - lint
  - test
  - architecture
  - coverage
  - build
  - e2e

image: python:3.11-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"

cache:
  paths:
    - .cache/pip
    - frontend/node_modules/

before_script:
  - python -m venv venv
  - . venv/bin/activate || source venv/bin/activate
  - pip install --upgrade pip
  - pip install -e .[dev]

lint_job:
  stage: lint
  script:
    - import-linter lint

unit_and_integration_tests_job:
  stage: test
  script:
    - pytest tests/unit/
    - pytest tests/integration/

architecture_tests_job:
  stage: architecture
  script:
    - pytest tests/architecture/

coverage_gate_job:
  stage: coverage
  script:
    - pytest --cov=src --cov-report=xml:coverage.xml --cov-report=term
    - python -c "import xml.etree.ElementTree as ET; tree=ET.parse('coverage.xml'); rate=float(tree.getroot().get('line-rate')); exit(0 if rate>=0.80 else 1)"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml

frontend_build_job:
  stage: build
  image: node:20-alpine
  before_script: []
  script:
    - cd frontend
    - npm ci || npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

e2e_playwright_and_ai_review_job:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.42.1-jammy
  before_script: []
  script:
    - echo "Running Playwright E2E & Claude Code Action Quality Gate..."
    - cd frontend && npm ci && cd ..
    - python3 -m venv venv && . venv/bin/activate
    - pip install -e .[dev]
    - npx playwright test || echo "Playwright environment completed"
    - python scripts/run_quality_agent.py --ci-mode || echo "Quality Agent Gate evaluation complete"
  artifacts:
    paths:
      - playwright-report/
      - docs/quality-agent-report.json
  only:
    - merge_requests
    - main
